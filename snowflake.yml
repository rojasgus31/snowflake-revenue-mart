definition_version: "2"
entities:
  revenue_dashboard:
    type: streamlit
    identifier:
      name: REVENUE_PERFORMANCE_DASHBOARD
      schema: ANALYTICS
      database: REVENUE_ANALYTICS
    title: "Revenue Performance Dashboard"
    query_warehouse: WH_TRANSFORM_XS
    main_file: app/streamlit_app.py
    stage: ANALYTICS.STREAMLIT_STAGE
    artifacts:
      - app/streamlit_app.py
      - app/data_source.py
      - app/theme.css
      - .streamlit/config.toml
      # Deliberately not at the repository root. Streamlit Community Cloud
      # prefers an environment.yml over requirements.txt, and would build the
      # app with conda against Snowflake's package channel, which carries no
      # plotly, so the app failed at import. Mapped into the stage root here,
      # which is where the warehouse looks for it.
      - src: snowflake/environment.yml
        dest: environment.yml
