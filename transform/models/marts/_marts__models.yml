version: 2

models:
  - name: dim_date
    description: Monthly spine for calendar 2025. Empty months appear as zeros, not gaps.
    columns:
      - name: date_month
        data_tests: [unique, not_null]

  - name: dim_region
    columns:
      - name: region_name
        data_tests: [unique, not_null]

  - name: dim_customer
    description: >
      Type 1. Includes synthetic rows for customers present in orders but
      absent from Salesforce, preserving referential integrity without
      discarding revenue.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: region
        data_tests:
          - relationships:
              to: ref('dim_region')
              field: region_name

  - name: dim_product
    description: Type 1, with synthetic rows for products absent from the master.
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: fct_orders
    description: >
      Order-line grain, carrying the per-order delivery detail that cannot be
      represented at the monthly mart grain.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: product_id
        data_tests:
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: region
        data_tests:
          - relationships:
              to: ref('dim_region')
              field: region_name
      - name: delivery_status
        data_tests:
          - accepted_values:
              values: ["On Time", "Late", "Not Delivered", "Cancelled", "Unknown"]

  - name: fct_forecast
    description: Plan grain, product x region x month.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [product_id, region, forecast_month]
    columns:
      - name: forecast_id
        data_tests: [unique, not_null]
      - name: forecast_revenue
        data_tests: [not_null]
