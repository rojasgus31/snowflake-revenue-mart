revenue_performance:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      # This path is resolved relative to the current working directory dbt is
      # invoked from, NOT relative to this project directory. The Makefile is the
      # sanctioned entry point for this project and it always invokes dbt from the
      # repository root, so this must match the default db_path in
      # ingest/load_raw.py (warehouse.duckdb at the repo root).
      path: warehouse.duckdb
      threads: 4

    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      # Defaults to Snowflake's own username/password authentication. Set
      # SNOWFLAKE_AUTHENTICATOR=externalbrowser to sign in through the browser
      # instead, which is what accounts using SSO or OAuth need and what avoids
      # storing a password at all. The adapter passes this value straight
      # through to the connector, so any authenticator the connector supports
      # works here. For unattended runs such as CI, prefer key-pair auth:
      # set this to jwt and add private_key_path.
      authenticator: "{{ env_var('SNOWFLAKE_AUTHENTICATOR', 'snowflake') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'WH_TRANSFORM_XS') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'REVENUE_ANALYTICS') }}"
      schema: staging
      threads: 4
      client_session_keep_alive: false
