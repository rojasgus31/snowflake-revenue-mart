[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
# Warm off-white, never pure white: oklch(0.98 0.004 65). The dashboard
# sits alongside other light documents on a shared, brightly lit screen,
# not among dark developer tooling, so a bright surface is now the read
# that survives a projector or a screen share rather than the one that
# washes out on one.
backgroundColor = "#FAF8F6"
secondaryBackgroundColor = "#F3EFED"
textColor = "#24211E"
borderColor = "#DAD7D3"
dataframeBorderColor = "#DAD7D3"
dataframeHeaderBackgroundColor = "#F3EFED"
# The house accent: this drives the active tab underline and label,
# focus rings, and the slider's active track and handle. It is a LOW
# saturation red -- oklch(0.55 0.10 27), half the chroma of the full
# saturation --red used for shortfall in charts (oklch(0.52 0.20 27),
# #C2181D) -- so it never competes with, or is mistaken for, the
# semantic red that means "below plan" in the data. Streamlit's default
# multiselect chip fill is solid primaryColor, which would read as a
# warning on every filter selection; app/theme.css overrides the chip to
# a light tint instead so the chrome stays a tint, never a saturated
# fill, everywhere it appears.
primaryColor = "#A45951"
linkColor = "#A45951"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, -apple-system, sans-serif"
headingFont = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, -apple-system, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, ui-monospace, monospace"
baseFontSize = 16
